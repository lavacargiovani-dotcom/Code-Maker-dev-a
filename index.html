<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeMaker — Construímos o universo digital do seu negócio</title>
<meta name="description" content="CodeMaker desenvolve sites, sistemas e aplicações sob medida. Do primeiro commit ao lançamento, construímos o universo digital da sua marca.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#05060d;
    --void-2:#090b18;
    --panel:#0d1024;
    --panel-line:rgba(150,160,220,0.14);
    --violet:#8b5cf6;
    --violet-soft:rgba(139,92,246,0.16);
    --cyan:#38e8ff;
    --amber:#ffb454;
    --text:#eef1fb;
    --text-muted:#9aa3c7;
    --text-dim:#6b7299;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
    --container: 1180px;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--void);
    color:var(--text);
    font-family:var(--font-body);
    line-height:1.6;
    overflow-x:hidden;
    position:relative;
  }
  ::selection{background:var(--violet); color:#fff;}

  /* ---------- persistent starfield behind every section ---------- */
  .starfield{
    position:fixed;
    inset:0;
    z-index:-2;
    background:var(--void);
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px, rgba(255,255,255,.55), transparent),
      radial-gradient(1.5px 1.5px at 130px 90px, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 210px 40px, rgba(255,255,255,.5), transparent),
      radial-gradient(1.5px 1.5px at 60px 160px, rgba(255,255,255,.35), transparent),
      radial-gradient(1px 1px at 290px 200px, rgba(255,255,255,.45), transparent),
      radial-gradient(1.5px 1.5px at 340px 60px, rgba(255,255,255,.3), transparent),
      radial-gradient(1px 1px at 380px 150px, rgba(255,255,255,.4), transparent),
      radial-gradient(2px 2px at 400px 300px, rgba(139,92,246,.5), transparent);
    background-repeat:repeat;
    background-size:420px 420px;
    animation:driftStars 140s linear infinite;
  }
  .starfield::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(ellipse at 50% -10%, rgba(139,92,246,.10), transparent 60%);
  }
  @keyframes driftStars{
    from{background-position:0 0;}
    to{background-position:-420px -420px;}
  }
  @media (prefers-reduced-motion: reduce){
    .starfield{animation:none;}
  }

  a{color:inherit; text-decoration:none;}
  ul{list-style:none;}
  img{max-width:100%; display:block;}
  button{font-family:inherit; cursor:pointer;}

  .container{
    max-width:var(--container);
    margin:0 auto;
    padding:0 28px;
  }
  section{position:relative; padding:120px 0;}
  @media (max-width:720px){ section{padding:80px 0;} }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:var(--font-mono);
    font-size:13px;
    letter-spacing:.02em;
    color:var(--cyan);
    background:var(--violet-soft);
    border:1px solid rgba(139,92,246,.35);
    padding:6px 14px;
    border-radius:100px;
    margin-bottom:22px;
  }
  .eyebrow::before{content:"›"; color:var(--amber);}

  h1,h2,h3,h4{
    font-family:var(--font-display);
    font-weight:600;
    letter-spacing:-0.01em;
    line-height:1.12;
  }
  h2{font-size:clamp(30px,4vw,46px); margin-bottom:16px;}
  h3{font-size:20px;}
  .section-head{max-width:640px; margin-bottom:56px;}
  .section-head p{color:var(--text-muted); font-size:17px;}

  .btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:15px 26px;
    border-radius:12px;
    font-weight:600;
    font-size:15px;
    border:1px solid transparent;
    transition:transform .25s ease, box-shadow .25s ease, background .25s ease, border-color .25s ease;
    white-space:nowrap;
  }
  .btn:focus-visible{outline:2px solid var(--cyan); outline-offset:3px;}
  .btn-primary{
    background:linear-gradient(135deg, var(--violet), #6d3ff0);
    color:#fff;
    box-shadow:0 8px 30px -8px rgba(139,92,246,.65);
  }
  .btn-primary:hover{transform:translateY(-2px); box-shadow:0 14px 36px -8px rgba(139,92,246,.85);}
  .btn-ghost{
    background:rgba(255,255,255,.03);
    border-color:var(--panel-line);
    color:var(--text);
    backdrop-filter:blur(6px);
  }
  .btn-ghost:hover{border-color:rgba(56,232,255,.5); color:var(--cyan); transform:translateY(-2px);}
  .btn-wpp{
    background:#12b76a;
    color:#fff;
  }
  .btn-wpp:hover{transform:translateY(-2px); box-shadow:0 12px 30px -8px rgba(18,183,106,.6);}

  /* ---------- header ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:100;
    padding:22px 0;
    transition:background .35s ease, padding .35s ease, border-color .35s ease;
    border-bottom:1px solid transparent;
  }
  header.scrolled{
    padding:14px 0;
    background:rgba(5,6,13,.78);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--panel-line);
  }
  header .container{display:flex; align-items:center; justify-content:space-between;}
  .logo{
    font-family:var(--font-display);
    font-weight:700;
    font-size:21px;
    display:flex; align-items:center; gap:9px;
  }
  .logo .dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 12px 3px rgba(56,232,255,.8);
  }
  .logo .prompt{color:var(--text-dim); font-family:var(--font-mono); font-weight:400;}
  nav.main-nav ul{display:flex; gap:34px; align-items:center;}
  nav.main-nav a{
    font-size:14.5px; color:var(--text-muted); font-weight:500;
    position:relative; padding:4px 0;
    transition:color .2s ease;
  }
  nav.main-nav a::after{
    content:""; position:absolute; left:0; bottom:-4px; width:0; height:1px;
    background:var(--cyan); transition:width .25s ease;
  }
  nav.main-nav a:hover{color:var(--text);}
  nav.main-nav a:hover::after{width:100%;}
  .header-actions{display:flex; align-items:center; gap:14px;}
  .burger{display:none; flex-direction:column; gap:5px; background:none; border:none; padding:6px;}
  .burger span{width:22px; height:2px; background:var(--text); display:block; transition:.3s;}

  @media (max-width:900px){
    nav.main-nav{
      position:fixed; top:0; right:0; height:100vh; width:min(320px,80vw);
      background:var(--void-2); border-left:1px solid var(--panel-line);
      padding:100px 32px 40px;
      transform:translateX(100%);
      transition:transform .35s ease;
      z-index:99;
    }
    nav.main-nav.open{transform:translateX(0);}
    nav.main-nav ul{flex-direction:column; align-items:flex-start; gap:26px;}
    .burger{display:flex;}
    .header-actions .btn-wpp span.long{display:none;}
  }

  /* ---------- hero ---------- */
  .hero{
    min-height:100vh;
    display:flex; align-items:center;
    position:relative;
    padding-top:120px;
    overflow:hidden;
  }
  .hero-video-wrap{
    position:absolute; inset:0; z-index:-1;
    overflow:hidden;
  }
  .hero-video-wrap video{
    width:100%; height:100%; object-fit:cover;
    filter:saturate(1.15) brightness(.85);
  }
  .hero-video-wrap::before{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(5,6,13,.55) 0%, rgba(5,6,13,.4) 35%, rgba(5,6,13,.85) 100%),
      linear-gradient(90deg, rgba(5,6,13,.75) 0%, rgba(5,6,13,.15) 45%, rgba(5,6,13,.15) 55%, rgba(5,6,13,.75) 100%);
  }
  .hero-grid{
    display:grid;
    grid-template-columns:1.1fr .9fr;
    gap:50px;
    align-items:center;
  }
  @media (max-width:980px){ .hero-grid{grid-template-columns:1fr;} }

  .hero h1{
    font-size:clamp(36px,5.4vw,64px);
    margin-bottom:22px;
  }
  .hero h1 .accent{
    background:linear-gradient(120deg, var(--cyan), var(--violet) 65%, var(--amber));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .hero p.lead{
    font-size:18px; color:var(--text-muted); max-width:520px; margin-bottom:36px;
  }
  .hero-ctas{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:44px;}
  .hero-meta{display:flex; gap:34px; flex-wrap:wrap;}
  .hero-meta div{font-family:var(--font-mono); font-size:13px; color:var(--text-dim);}
  .hero-meta strong{display:block; font-family:var(--font-display); font-size:22px; color:var(--text); font-weight:600;}

  /* terminal card */
  .terminal{
    background:rgba(10,12,26,.72);
    border:1px solid var(--panel-line);
    border-radius:16px;
    backdrop-filter:blur(16px);
    box-shadow:0 30px 80px -20px rgba(0,0,0,.6), 0 0 0 1px rgba(139,92,246,.06);
    overflow:hidden;
  }
  .terminal-bar{
    display:flex; align-items:center; gap:8px;
    padding:13px 16px;
    border-bottom:1px solid var(--panel-line);
    background:rgba(255,255,255,.02);
  }
  .terminal-bar span{width:11px; height:11px; border-radius:50%; display:block;}
  .terminal-bar span:nth-child(1){background:#ff5f57;}
  .terminal-bar span:nth-child(2){background:#febc2e;}
  .terminal-bar span:nth-child(3){background:#28c840;}
  .terminal-bar .path{
    margin-left:10px; font-family:var(--font-mono); font-size:12px; color:var(--text-dim);
  }
  .terminal-body{
    padding:22px 20px;
    font-family:var(--font-mono);
    font-size:13.5px;
    min-height:230px;
    color:#c7cef2;
  }
  .terminal-body .line{margin-bottom:10px; white-space:pre-wrap; word-break:break-word;}
  .terminal-body .prompt-sym{color:var(--cyan); margin-right:8px;}
  .terminal-body .ok{color:#39e991;}
  .terminal-body .comment{color:var(--text-dim);}
  .cursor{
    display:inline-block; width:7px; height:15px; background:var(--cyan);
    vertical-align:text-bottom; animation:blink 1s step-end infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  /* ---------- marquee ---------- */
  .marquee-wrap{
    border-top:1px solid var(--panel-line);
    border-bottom:1px solid var(--panel-line);
    padding:26px 0;
    overflow:hidden;
    background:rgba(255,255,255,.015);
  }
  .marquee-track{
    display:flex; gap:60px; width:max-content;
    animation:scrollMarquee 32s linear infinite;
    font-family:var(--font-mono);
    font-size:14px;
    color:var(--text-dim);
    letter-spacing:.03em;
  }
  .marquee-track span{display:flex; align-items:center; gap:10px;}
  .marquee-track b{color:var(--text-muted); font-weight:600;}
  @keyframes scrollMarquee{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }

  /* ---------- sobre ---------- */
  .about-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:60px; align-items:center;
  }
  @media (max-width:900px){ .about-grid{grid-template-columns:1fr;} }
  .about-copy p{color:var(--text-muted); margin-bottom:18px; font-size:16px;}
  .about-copy p strong{color:var(--text);}
  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:34px;}
  .stat-card{
    border:1px solid var(--panel-line); border-radius:14px; padding:20px 16px;
    background:rgba(255,255,255,.02);
  }
  .stat-card strong{
    font-family:var(--font-display); font-size:28px; display:block;
    background:linear-gradient(120deg,var(--cyan),var(--violet));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .stat-card span{font-size:12.5px; color:var(--text-dim);}

  .orbit-visual{
    position:relative; aspect-ratio:1/1; max-width:420px; margin:0 auto;
    display:flex; align-items:center; justify-content:center;
  }
  .orbit-visual .core{
    width:90px; height:90px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--cyan) 40%, var(--violet) 100%);
    box-shadow:0 0 60px 10px rgba(139,92,246,.55);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-weight:600; color:#0a0b16; font-size:13px;
    z-index:2;
  }
  .ring{
    position:absolute; border:1px dashed rgba(150,160,220,.25); border-radius:50%;
  }
  .ring1{width:65%; height:65%; animation:spin 18s linear infinite;}
  .ring2{width:88%; height:88%; animation:spin 30s linear infinite reverse;}
  .ring3{width:110%; height:110%; animation:spin 46s linear infinite;}
  .ring span{
    position:absolute; width:12px; height:12px; border-radius:50%;
    background:var(--amber); box-shadow:0 0 12px 3px rgba(255,180,84,.7);
    top:-6px; left:50%; transform:translateX(-50%);
  }
  .ring2 span{background:var(--cyan); box-shadow:0 0 12px 3px rgba(56,232,255,.7);}
  @keyframes spin{from{transform:rotate(0deg);} to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){ .ring{animation:none;} }

  /* ---------- serviços ---------- */
  .services-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:22px;
  }
  @media (max-width:960px){ .services-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:640px){ .services-grid{grid-template-columns:1fr;} }
  .service-card{
    border:1px solid var(--panel-line); border-radius:18px; padding:30px 26px;
    background:linear-gradient(160deg, rgba(255,255,255,.035), rgba(255,255,255,.01));
    transition:transform .3s ease, border-color .3s ease, box-shadow .3s ease;
    position:relative; overflow:hidden;
  }
  .service-card::before{
    content:""; position:absolute; inset:0; opacity:0; transition:opacity .3s ease;
    background:radial-gradient(220px circle at 30% 0%, rgba(139,92,246,.18), transparent 70%);
  }
  .service-card:hover{transform:translateY(-6px); border-color:rgba(56,232,255,.4); box-shadow:0 20px 50px -20px rgba(139,92,246,.4);}
  .service-card:hover::before{opacity:1;}
  .service-icon{
    width:46px; height:46px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background:var(--violet-soft); border:1px solid rgba(139,92,246,.35);
    margin-bottom:20px; font-size:20px;
  }
  .service-card h3{margin-bottom:10px;}
  .service-card p{color:var(--text-muted); font-size:14.5px; margin-bottom:16px;}
  .service-tag{
    font-family:var(--font-mono); font-size:11.5px; color:var(--cyan);
    background:rgba(56,232,255,.08); border:1px solid rgba(56,232,255,.25);
    padding:3px 10px; border-radius:100px; display:inline-block;
  }

  /* ---------- processo ---------- */
  .process-wrap{position:relative;}
  .process-line{
    position:absolute; left:27px; top:14px; bottom:14px; width:1px;
    background:linear-gradient(180deg, var(--violet), transparent);
    display:block;
  }
  @media (max-width:720px){ .process-line{display:none;} }
  .process-list{display:flex; flex-direction:column; gap:8px;}
  .process-item{
    display:grid; grid-template-columns:56px 1fr; gap:24px;
    padding:26px 0; position:relative;
  }
  .process-num{
    width:56px; height:56px; border-radius:50%;
    border:1px solid var(--panel-line); background:var(--panel);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:14px; color:var(--cyan);
    z-index:1;
  }
  .process-item h3{margin-bottom:6px;}
  .process-item p{color:var(--text-muted); font-size:15px; max-width:620px;}

  /* ---------- portfolio ---------- */
  .portfolio-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:22px;
  }
  @media (max-width:960px){ .portfolio-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:640px){ .portfolio-grid{grid-template-columns:1fr;} }
  .work-card{
    border-radius:18px; overflow:hidden; border:1px solid var(--panel-line);
    background:var(--panel);
    transition:transform .35s ease, box-shadow .35s ease;
  }
  .work-card:hover{transform:translateY(-6px); box-shadow:0 24px 60px -24px rgba(0,0,0,.7);}
  .work-thumb{
    aspect-ratio:16/10; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .work-thumb::before{
    content:""; position:absolute; inset:0;
    background-image:
      linear-gradient(180deg, transparent, rgba(0,0,0,.35)),
      radial-gradient(1px 1px at 15% 25%, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.5px 1.5px at 40% 80%, rgba(255,255,255,.6), transparent),
      radial-gradient(1px 1px at 85% 20%, rgba(255,255,255,.5), transparent);
  }
  .work-thumb .browser-dots{position:absolute; top:12px; left:14px; display:flex; gap:6px; z-index:2;}
  .work-thumb .browser-dots span{width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.35);}
  .work-thumb .glyph{font-family:var(--font-mono); font-size:34px; z-index:2; opacity:.9;}
  .thumb-1{background:linear-gradient(135deg,#241a4d,#0d1024);}
  .thumb-2{background:linear-gradient(135deg,#0f2e3b,#0d1024);}
  .thumb-3{background:linear-gradient(135deg,#3a1d3f,#0d1024);}
  .thumb-4{background:linear-gradient(135deg,#1c2a4a,#0d1024);}
  .thumb-5{background:linear-gradient(135deg,#2a1f4a,#0d1024);}
  .thumb-6{background:linear-gradient(135deg,#123328,#0d1024);}
  .work-info{padding:20px 22px;}
  .work-info .service-tag{margin-bottom:10px;}
  .work-info h3{font-size:17px; margin-bottom:4px;}
  .work-info p{font-size:13.5px; color:var(--text-dim);}

  /* ---------- youtube ---------- */
  .yt-section .container{
    background:linear-gradient(135deg, rgba(139,92,246,.14), rgba(56,232,255,.05));
    border:1px solid var(--panel-line);
    border-radius:24px;
    padding:56px;
    display:grid; grid-template-columns:1fr auto; gap:40px; align-items:center;
  }
  @media (max-width:760px){ .yt-section .container{grid-template-columns:1fr; text-align:center; padding:40px 26px;} }
  .yt-section h2{margin-bottom:10px;}
  .yt-section p{color:var(--text-muted); max-width:480px;}
  @media (max-width:760px){ .yt-section p{margin:0 auto;} }
  .yt-play{
    width:64px; height:64px; border-radius:50%; background:#ff3b3b; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:22px;
    box-shadow:0 0 0 8px rgba(255,59,59,.12);
  }
  .yt-row{display:flex; align-items:center; gap:16px; margin-top:22px;}
  @media (max-width:760px){ .yt-row{justify-content:center;} }

  /* ---------- depoimentos ---------- */
  .testi-wrap{position:relative; max-width:760px; margin:0 auto;}
  .testi-track{overflow:hidden;}
  .testi-slides{display:flex; transition:transform .5s ease;}
  .testi-slide{min-width:100%; padding:4px;}
  .testi-card{
    border:1px solid var(--panel-line); border-radius:20px; padding:40px;
    background:rgba(255,255,255,.02); text-align:center;
  }
  .testi-stars{color:var(--amber); font-size:16px; margin-bottom:18px; letter-spacing:3px;}
  .testi-quote{font-family:var(--font-display); font-size:20px; font-weight:500; margin-bottom:24px; line-height:1.5;}
  .testi-person{display:flex; align-items:center; justify-content:center; gap:12px;}
  .testi-avatar{
    width:42px; height:42px; border-radius:50%;
    background:linear-gradient(135deg,var(--cyan),var(--violet));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:600; color:#0a0b16; font-size:15px;
  }
  .testi-person div{text-align:left;}
  .testi-person strong{display:block; font-size:14.5px;}
  .testi-person span{font-size:12.5px; color:var(--text-dim);}
  .testi-dots{display:flex; justify-content:center; gap:9px; margin-top:28px;}
  .testi-dots button{
    width:8px; height:8px; border-radius:50%; border:none; background:var(--panel-line);
    padding:0; transition:background .25s ease, transform .25s ease;
  }
  .testi-dots button.active{background:var(--cyan); transform:scale(1.3);}

  /* ---------- contato ---------- */
  .contact-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:50px;
  }
  @media (max-width:900px){ .contact-grid{grid-template-columns:1fr;} }
  .contact-panel{
    border:1px solid var(--panel-line);
